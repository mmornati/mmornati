name: git log feed

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/feed.py"
      - ".github/workflows/feed.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Merge blog and Mastodon into the README
        run: python3 scripts/feed.py --readme README.md
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git pull --rebase --autostash
          if git commit -m "chore: update git log feed"; then
            git push
          fi
